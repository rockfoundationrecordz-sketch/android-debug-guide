<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>probe2</title>
<style>
body{font:17px system-ui;margin:14px}
a{display:block;padding:14px;margin:9px 0;background:#eef0f3;border:1px solid #ccd;border-radius:10px;text-decoration:none;color:#000}
a b{display:block;font-size:19px}
a small{color:#555;font-size:13px}
</style>
</head>
<body>
<h3>Settings deep-link probe 2</h3>
<a href="intent:#Intent;action=android.settings.SETTINGS;end"><b>1</b><small>action only, no scheme or host</small></a>
<a href="intent://#Intent;action=android.settings.SETTINGS;package=com.android.settings;end"><b>2</b><small>empty host + package</small></a>
<a href="intent://settings/#Intent;scheme=android-app;package=com.android.settings;action=android.settings.SETTINGS;end"><b>3</b><small>scheme=android-app</small></a>
<a href="intent://settings/#Intent;component=com.android.settings/.Settings;end"><b>4</b><small>component com.android.settings/.Settings</small></a>
<a href="intent://#Intent;component=com.android.settings/.Settings;end"><b>5</b><small>component, no host</small></a>
<a href="intent://settings/#Intent;action=android.settings.APPLICATION_DEVELOPMENT_SETTINGS;package=com.android.settings;end"><b>6</b><small>dev-options action + package</small></a>
<a href="intent://settings/#Intent;scheme=settings;package=com.android.settings;action=android.settings.SETTINGS;end"><b>7</b><small>scheme=settings</small></a>
<a href="intent://settings/#Intent;action=android.settings.SETTINGS;package=com.android.settings;launchFlags=0x10000000;end"><b>8</b><small>launchFlags new task</small></a>
<a href="intent://www.google.com/#Intent;scheme=https;package=com.android.chrome;action=android.intent.action.VIEW;end"><b>9</b><small>CONTROL: chrome https</small></a>
</body>
</html>
